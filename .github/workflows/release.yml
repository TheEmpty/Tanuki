name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: Check
    # macOS and Windows are the platforms Tanuki ships on, and they are the
    # ones that can be checked without a pile of system libraries: building
    # Tauri on Linux needs the GTK and WebKit development packages, which the
    # runners do not have.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- --deny warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # A release holds files, not folders, so the app is put in a zip and
      # everything is gathered into one directory.
      - name: Gather the installers
        shell: bash
        run: |
          dist="$GITHUB_WORKSPACE/dist"
          bundle="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/bundle"
          mkdir -p "$dist"
          if [ "${{ matrix.name }}" = "macOS" ]; then
            cp "$bundle"/dmg/*.dmg "$dist/"
            (cd "$bundle/macos" && zip -r "$dist/Tanuki.app.zip" Tanuki.app)
          else
            cp "$bundle"/msi/*.msi "$dist/"
            cp "$bundle"/nsis/*.exe "$dist/"
          fi
          ls -l "$dist"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: tanuki-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the installers, and not what the Tauri action uploaded for
      # itself.
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: tanuki-*
          merge-multiple: true

      - name: List what is being published
        run: find bundles -type f | sort

      # The notes are a screenshot of this version, a blurb about what the
      # application is and does, and then the notes for this version. A
      # reader who lands on this release may never have seen the app.
      - name: Write the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 dev/release-notes.py "$TAG" > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Tanuki $TAG" \
            --notes-file notes.md \
            bundles/*
