<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Tanuki mascot as a pumpkin, for the Halloween look.

    It is the same face, but the head is a pumpkin: orange, with a stem
    between the ears and a few grooves around the edge. The scarf is
    green, the colour of a stem.
  -->
  <g transform="translate(0 26)">
    <!-- Ears -->
    <path d="M132 150 q-34 -58 12 -70 q40 -10 52 46 z" fill="#B85A14"/>
    <path d="M380 150 q34 -58 -12 -70 q-40 -10 -52 46 z" fill="#B85A14"/>
    <path d="M140 142 q-22 -38 8 -46 q26 -7 34 30 z" fill="#D97722"/>
    <path d="M372 142 q22 -38 -8 -46 q-26 -7 -34 30 z" fill="#D97722"/>

    <!-- The stem, poking out between the ears -->
    <path d="M244 132 q-6 -36 8 -52 q14 6 12 26 q-2 16 -20 26 z" fill="#5C8F35"/>
    <path d="M252 84 q-2 -14 4 -20 q8 6 6 16 q-4 6 -10 4 z" fill="#6FA33F"/>

    <!-- Head -->
    <ellipse cx="256" cy="232" rx="146" ry="128" fill="#E8871E"/>
    <ellipse cx="256" cy="252" rx="120" ry="102" fill="#F6B650"/>

    <!-- The grooves of a pumpkin, following the rim of the head -->
    <g fill="none" stroke="#C1650F" stroke-width="8" stroke-linecap="round">
      <path d="M224 106 Q 178 118 148 162"/>
      <path d="M288 106 Q 334 118 364 162"/>
      <path d="M136 190 Q 124 224 128 258"/>
      <path d="M376 190 Q 388 224 384 258"/>
    </g>

    <!-- Face mask -->
    <path d="M150 196 q54 -30 106 -30 q52 0 106 30 q-6 62 -56 66 q-50 4 -100 -6 q-50 -10 -56 -60 z" fill="#3B2712"/>

    <!-- Eyes -->
    <ellipse cx="206" cy="196" rx="34" ry="36" fill="#FFFFFF"/>
    <ellipse cx="306" cy="196" rx="34" ry="36" fill="#FFFFFF"/>
    <circle cx="210" cy="200" r="17" fill="#2B1A0E"/>
    <circle cx="310" cy="200" r="17" fill="#2B1A0E"/>
    <circle cx="204" cy="194" r="6" fill="#FFFFFF"/>
    <circle cx="304" cy="194" r="6" fill="#FFFFFF"/>

    <!-- Muzzle and nose -->
    <ellipse cx="256" cy="290" rx="62" ry="48" fill="#FFF6E9"/>
    <path d="M256 258 q28 0 28 22 q0 20 -28 20 q-28 0 -28 -20 q0 -22 28 -22 z" fill="#2B1A0E"/>
    <ellipse cx="256" cy="316" rx="20" ry="13" fill="#2B1A0E"/>

    <!-- Moustache -->
    <path d="M256 330 q-40 -6 -66 12 q26 10 48 4 q-16 8 -22 20 q28 4 40 -12 q12 16 40 12 q-6 -12 -22 -20 q22 6 48 -4 q-26 -18 -66 -12 z" fill="#FFF6E9"/>

    <!-- Cheeks -->
    <circle cx="140" cy="268" r="26" fill="#F2426B" opacity="0.45"/>
    <circle cx="372" cy="268" r="26" fill="#F2426B" opacity="0.45"/>

    <!-- Scarf, the green of a stem -->
    <path d="M136 348 q120 46 240 0 q10 26 -4 44 q-116 44 -232 0 q-14 -18 -4 -44 z" fill="#4E7A2E"/>
    <path d="M300 388 q40 16 30 66 q-24 12 -44 4 q16 -40 14 -70 z" fill="#3E6624"/>
    <circle cx="318" cy="470" r="13" fill="#E8871E"/>
  </g>
</svg>
