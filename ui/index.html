<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanuki</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <img class="mascot" id="mascot" src="mascot.svg" alt="" />
        <div>
          <h1>Tanuki</h1>
          <p class="tagline">An unofficial third-party WaniKani review notifier.</p>
        </div>
      </header>

      <section class="status" id="status" aria-live="polite" hidden>
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Checking…</span>
      </section>

      <section class="card">
        <h2>WaniKani account</h2>
        <p class="hint" id="token-hint">
          Tanuki needs a personal access token to read your reviews.
        </p>
        <div class="row">
          <input
            id="token"
            type="password"
            placeholder="Personal access token"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="save-token" class="primary">Save</button>
        </div>
        <div class="row row-links">
          <a
            href="https://www.wanikani.com/settings/personal_access_tokens"
            id="token-link"
            >Get a token</a
          >
          <span class="hint" id="token-state"></span>
        </div>
      </section>

      <section class="card">
        <h2>Settings</h2>

        <div class="toggle toggle-theme">
          <span>
            <strong>Theme</strong>
            <em>How Tanuki looks and sounds.</em>
          </span>
          <select id="theme"></select>
        </div>

        <label class="toggle">
          <input type="checkbox" id="sound" />
          <span>
            <strong>Play a sound</strong>
            <em>Chime when reviews are ready.</em>
          </span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="themed-sounds" />
          <span>
            <strong>Allow themes to change notification sounds</strong>
            <em>Use the theme's own chime.</em>
          </span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="notification" />
          <span>
            <strong>Show a notification</strong>
            <em>Notify when reviews are ready.</em>
          </span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="announce-level-ups" />
          <span>
            <strong>Announce level ups</strong>
            <em>Chime and notify when you level up.</em>
          </span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="launch-at-login" />
          <span>
            <strong>Launch at login</strong>
          </span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="notify-lessons" />
          <span>
            <strong>Also announce lessons</strong>
            <em>Notify when new lessons unlock as well as reviews.</em>
          </span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="quit-with-command-q" />
          <span>
            <strong>Quit with Command-Q</strong>
            <em>Otherwise it only puts the window away.</em>
          </span>
        </label>
      </section>

      <section class="card">
        <h2>Test Notifications</h2>
        <div class="row">
          <button id="test">Play a test notification</button>
        </div>
      </section>

      <footer class="footer">
        <p>
          Not affiliated with WaniKani. Only reads your review queue.
        </p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
